name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # البطاقاتُ الاجتماعية (public/og/*.png وog-cover.png) أصولٌ مولَّدة ومُودَعة.
      # فإن تعذّر رسمها بقيت قديمة **بصمت** — وقد حدث فعلًا: بطاقة apex-cv أعلنت
      # «١٤٢ تقييمًا» والكتالوج يقول ٨. فالتثبيت خطوةٌ جادة (بلا `|| echo`)،
      # والإصدارات مثبّتة لأن فحص الانحراف بعدها يقارن البايت بالبايت.
      # والخطوط نفسها مضمّنة في scripts/fonts/ (لا خطوط النظام): فنسخُ DejaVu
      # تختلف بين البيئات وكانت تضمن انحرافًا دائمًا مهما تثبّتت الإصدارات.
      - name: Python deps for the generated social cards
        run: python3 -m pip install --quiet pillow==12.3.0 arabic_reshaper==3.0.1 python-bidi==0.6.11

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # البناء قبل الاختبارات: فحص الطباعة يقرأ stylesheet المبني لا المصدر،
      # فوجود dist هنا يعني أن الوعد يُختبَر في CI كما يُختبَر عندك محليًا.
      - name: Build
        run: npm run build

      # البناء (prebuild) يُعيد توليد كل الأصول المولَّدة. فالمقارنةُ تكون على ما هو
      # دالّةٌ في محتوى المستودع وحده: manifest البطاقات (كل نصٍّ دخل في رسمها:
      # الأسعار والتقييمات وسطر الغلاف المحسوب من الكتالوج) وrobots وsitemap وllms
      # وكتلة meta في index.html. فإن غيّر أحدٌ الكتالوج ولم يُعد التوليد سقط الفحص —
      # وهذا بالضبط مرضُ بطاقةٍ تعلن ١٤٢ تقييمًا والكتالوج يقول ٨.
      # (لا نقارن بايتات الـPNG: raster العربي يختلف بين البيئات ولو ثُبّتت الإصدارات،
      # فالبايتات ليست عقدًا — والعقد هو الـmanifest.)
      - name: Generated assets match the catalog (no silent drift)
        run: git diff --exit-code -- public/og/manifest.json public/robots.txt public/sitemap.xml public/llms.txt index.html

      - name: Tests (real app rendered in jsdom + admin API over a spawned server)
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
