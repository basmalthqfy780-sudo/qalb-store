name: live-check

# فحصٌ مؤقّت: بيئةُ الوكيل لا تصل إلى vercel.app ولا إلى سجلّات Actions، فيقرأ
# المُشغّلُ الشيفرةَ المنشورة فعلًا وينشر النتيجة تعليقًا على PR #22 (يُحذَف الملف بعد القراءة).
on:
  push:
    branches: ['arena/01a0d9f1-qalb-store']

permissions:
  contents: read
  pull-requests: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Read what production serves, and publish it as a comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=/tmp/result.md
          echo '### live-check · ما تُنشره Vercel الآن (هذه لحظة القراءة)' > $RESULT
          echo '```' >> $RESULT
          for U in https://qalb-store.vercel.app/ https://qalb.store/ https://qalb-store-44rm82hww-basmalthqfy780-sudo.vercel.app/; do
            echo "===== $U" >> $RESULT
            if curl -sS -m 30 -o /tmp/p.html -w 'html http %{http_code} · %{size_download} bytes' "$U" >> $RESULT 2>&1; then
              echo >> $RESULT
              ASSETS=$(grep -o 'assets/[A-Za-z0-9._-]*\.js' /tmp/p.html | sort -u || true)
              echo "assets in html: ${ASSETS:-none}" >> $RESULT
              for A in $ASSETS; do
                curl -sS -m 30 -o /tmp/a.js "$U$A" || true
                echo "  $A  →  new margin [150px 0px]: $(grep -c '150px 0px' /tmp/a.js || true) · old margin [0px 0px -8% 0px]: $(grep -c '0px 0px -8% 0px' /tmp/a.js || true)" >> $RESULT
              done
            else
              echo ' unreachable' >> $RESULT
            fi
          done
          echo '```' >> $RESULT
          cat $RESULT
          gh pr comment 22 --repo "$GITHUB_REPOSITORY" --body-file $RESULT
